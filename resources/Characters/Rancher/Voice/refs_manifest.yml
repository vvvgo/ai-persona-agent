# Голосовые референсы персонажа.
#
# Синтез речи с клонированием голоса берёт отсюда образец: эмоция -> какой файл
# служит образцом голоса и что в нём произнесено. Расшифровка (text) обязана
# совпадать с тем, что реально звучит в файле, иначе клонирование поедет.
#
# wav  — имя файла в этой папке, без расширения .wav
# text — точная расшифровка того, что в файле сказано
#
# Обязательна только эмоция neutral: если запрошенной эмоции нет, берётся она.
# Остальные добавляются по желанию — сколько угодно.
#
# Эти образцы синтезированы стандартным голосом и лежат для того, чтобы проект
# заводился из коробки. Свой персонаж начинается с их замены:
# docs/help/CUSTOMIZATION.md, раздел «Голос персонажа».

neutral:
  wav: neutral
  text: Чем могу быть полезен?

happy:
  wav: happy
  text: Отличные новости, у нас всё получилось!

sad:
  wav: sad
  text: Опять ничего не вышло.

sarcastic:
  wav: sarcastic
  text: Ну надо же, какая неожиданность.
